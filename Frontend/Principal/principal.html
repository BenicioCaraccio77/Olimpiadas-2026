<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">

    <title>Aerolíneas CATB</title>
</head>

<body>

    <div class="CONTENIDO">
        <div class="ENCABEZADO">
            <p class="MARCA">AEROLÍNEAS CATB</p>
            <h1>Tu próxima historia<br>comienza acá</h1>
            <p class="SUBTITULO">Elegí cómo querés viajar y empezá a descubrir el mundo.</p>
        </div>
        <div class="BOTONES">

            <a href="carrito/carrito.html" class="BOTON-CARRITO">
                🛒 Carrito
            </a>

            <button id="cerrar-sesion" class="BOTON-CERRAR">
                Cerrar sesión
            </button>

        </div>

        <div class="REDIRECCION">
            <a href="paquetes/index.html" class="CAJA-AEROPUERTO">
                <div>
                    <h2>Paquetes</h2>
                    <p>Todo listo para tu viaje</p>
                </div>
                <span class="FLECHA">→</span>
            </a>
            <a href="alojamientos/alojamientos.html" class="CAJA-AEROPUERTO">
                <div>
                    <h2>Alojamiento</h2>
                    <p>Encontrá dónde quedarte</p>
                </div>
                <span class="FLECHA">→</span>
            </a>
            <a href="vuelos/vuelos.html" class="CAJA-AEROPUERTO">
                <div>
                    <h2>Vuelos</h2>
                    <p>Elegí tu próximo destino</p>
                </div>
                <span class="FLECHA">→</span>
            </a>
            <a href="alquiler-autos/alquiler.html" class="CAJA-AEROPUERTO">
                <div>
                    <h2>Alquiler de autos</h2>
                    <p>Movete con libertad</p>
                </div>
                <span class="FLECHA">→</span>
            </a>
        </div>
    </div>

    <script>

    document.getElementById("cerrar-sesion").addEventListener("click", () => {

        const confirmar = confirm(
            "¿Querés cerrar sesión?"
        )

        if (!confirmar) {
            return
        }

        localStorage.removeItem("access_token")

        window.location.href = "../login/login.html"

    })

</script>
</body>
</html>
